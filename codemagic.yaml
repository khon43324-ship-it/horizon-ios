    scripts:
      - name: Install Rust and iOS Target
        script: curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y && source $HOME/.cargo/env && rustup target add aarch64-apple-ios
      - name: Prepare Assets (Requires Java 25 and Python)
        script: source $HOME/.cargo/env && cargo run --release -p horizon-prepare -- --prepare
      - name: Build Rust iOS Client
        script: source $HOME/.cargo/env && cargo build --release --target aarch64-apple-ios -p horizon-client
      - name: Package IPA for TrollStore
        script: |
          mkdir -p Payload
          cp target/aarch64-apple-ios/release/horizon-client Payload/
          cat <<EOF > Payload/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>horizon-client</string>
              <key>CFBundleIdentifier</key>
              <string>com.heyskylo.horizonios</string>
              <key>CFBundleName</key>
              <string>HorizonRust</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF
          zip -r HorizonMinecraft.ipa Payload
